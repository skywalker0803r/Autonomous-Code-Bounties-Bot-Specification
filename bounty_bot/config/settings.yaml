llm:
  provider: claude_code
  api_key: ${OPENAI_API_KEY}
  local_base_url: http://127.0.0.1:11434/v1
github:
  token: ${GITHUB_TOKEN}
  cli_available: true
opirebot:
  enabled: true
filters:
  languages:
  - Python
  - TypeScript
  - JavaScript
  min_bounty_amount: 12.0
  max_ai_cost_usd: 8.0
  exclude_labels:
  - Needs Discussion
  - Design Required
  - Question
docker:
  memory_limit: 4g
  cpu_limit: 2.0
  timeout_seconds: 300
  registry: localhost
testing:
  mode: docker
resources:
  max_parallel_tests: 1
  reserved_ram_gb: 12
  max_retries: 3
monitoring:
  poll_interval_seconds: 300
  daemon_mode: false
  log_level: INFO
submission:
  auto_submit_pr: true
