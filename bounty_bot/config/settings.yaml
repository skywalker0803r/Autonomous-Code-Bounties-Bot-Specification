llm:
  provider: claude_code
  api_key: ${OPENAI_API_KEY}
github:
  token: ${GITHUB_TOKEN}
  cli_available: true
algora:
  enabled: false
  api_endpoint: https://api.algora.io/v1/bounties
  rate_limit: 60
filters:
  languages:
  - Python
  - TypeScript
  - JavaScript
  min_bounty_amount: 50.0
  max_ai_cost_usd: 5.0
  exclude_labels:
  - Needs Discussion
  - Design Required
  - Question
docker:
  memory_limit: 4g
  cpu_limit: 2.0
  timeout_seconds: 300
  registry: localhost
resources:
  max_parallel_tests: 1
  reserved_ram_gb: 12
  max_retries: 3
monitoring:
  poll_interval_seconds: 300
  daemon_mode: false
  log_level: INFO
submission:
  auto_submit_pr: true
